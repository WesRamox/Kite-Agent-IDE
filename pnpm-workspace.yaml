# electron/node-pty são nativos; layout hoisted evita problemas de resolução no Electron
nodeLinker: hoisted

# pnpm não roda scripts de instalação sem permissão explícita
allowBuilds:
  esbuild: true
  node-pty: true
  '@parcel/watcher': true
  # instalador Squirrel, que o Kite não usa (Windows sai em NSIS)
  electron-winstaller: false

minimumReleaseAgeExclude:
  - electron@44.7.1
