# Lint, tipos, testes e e2e em todo push e PR. A release (release.yml) só roda em tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos e unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes de unidade (com cobertura)
        run: pnpm test:coverage

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| | % |\n|---|---|');for(const k of ['lines','statements','functions','branches'])console.log('|'+k+'|'+t[k].pct+'|')" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Só falha com severidade alta ou crítica; as baixas ficam no relatório.
      - name: Auditoria das dependências de produção
        run: pnpm audit --prod --audit-level high

  e2e:
    name: e2e (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O Ubuntu 24.04 bloqueia user namespaces sem privilégio, que o sandbox do Chromium usa.
      - name: Liberar o sandbox do Electron
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: pnpm exec electron-vite build

      - name: Playwright
        run: xvfb-run --auto-servernum pnpm exec playwright test

      - name: Artefatos de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
